server:
  host: "0.0.0.0"
  http_port: 3001
  ws_port: 8081

influxdb:
  url: "http://127.0.0.1:8086"
  token: "my-super-secret-token"
  org: "myorg"
  buckets:
    candles: "trading_candles"
    orderbook: "trading_orderbook"
    orderbook_agg: "trading_orderbook_agg"
    market_analysis: "market_analysis"

market_analysis:
  enabled: true
  time_window_minutes: 60
  min_orderbook_depth: 10
  min_candle_count: 20
  confidence_threshold: 0.7
  analysis_interval_minutes: 15
